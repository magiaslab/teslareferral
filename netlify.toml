[build]
  command = "npm run build"
  publish = "dist"

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    X-Frame-Options = "DENY"

[[headers]]
  for = "/fonts/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/img/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/favicon.svg"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[redirects]]
  from = "/guida/come-funziona-il-referral-tesla"
  to = "/come-funziona"
  status = 301

[[redirects]]
  from = "/referral-tesla-model-y"
  to = "/model-y"
  status = 301

[[redirects]]
  from = "/referral-tesla-model-3"
  to = "/model-3"
  status = 301

[[redirects]]
  from = "/referral-tesla-model-s"
  to = "/come-funziona"
  status = 301

[[redirects]]
  from = "/referral-tesla-model-x"
  to = "/come-funziona"
  status = 301
