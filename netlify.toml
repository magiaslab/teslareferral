[build]
  command = "npm run build"
  publish = "dist"

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    X-Frame-Options = "DENY"

[[headers]]
  for = "/fonts/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/img/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/favicon.svg"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[redirects]]
  from = "/guida/come-funziona-il-referral-tesla"
  to = "/come-funziona"
  status = 301
  force = true

[[redirects]]
  from = "/referral-tesla-model-y"
  to = "/model-y"
  status = 301
  force = true

[[redirects]]
  from = "/referral-tesla-model-3"
  to = "/model-3"
  status = 301
  force = true

[[redirects]]
  from = "/referral-tesla-model-s"
  to = "/come-funziona"
  status = 301
  force = true

[[redirects]]
  from = "/referral-tesla-model-x"
  to = "/come-funziona"
  status = 301
  force = true

[[redirects]]
  from = "/prezzi"
  to = "/prezzo-incentivi"
  status = 301
  force = true

[[redirects]]
  from = "/incentivi"
  to = "/prezzo-incentivi"
  status = 301
  force = true

# Anche /pagina/ risponde 200 con il file della pagina, senza redirect.
# Chi aveva in cache il vecchio 301 di Netlify (/pagina -> /pagina/) altrimenti
# finisce in loop con il 301 inverso. Il canonical resta /pagina.

[[redirects]]
  from = "/come-funziona/"
  to = "/come-funziona.html"
  status = 200
  force = true

